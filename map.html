<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BEC Quiz — 10 MCQs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>BEC Quiz</h1>
      <p>10 randomly selected MCQs from the BEC question bank. Select one option per question and click <strong>Submit</strong>.</p>
    </header>

    <main id="quiz-area">
      <div id="questions"></div>

      <div class="actions">
        <button id="submitBtn">Submit</button>
        <button id="reloadBtn">Try New 10</button>
      </div>

      <div id="result" class="result hidden">
        <h2>Your Result</h2>
        <p id="scoreText"></p>
        <p id="percentText"></p>
      </div>
    </main>

    <footer>
      <small>Prepared by: Your Name — BEC Quiz</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
